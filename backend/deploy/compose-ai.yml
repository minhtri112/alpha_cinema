services:
  ai-service:
    image: ${DOCKER_USERNAME}/ai-service:latest
    container_name: ai-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATASOURCE_URL: ${AI_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${AI_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "8088:8088"
    restart: always
