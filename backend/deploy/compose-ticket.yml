services:
  ticket-service:
    image: ${DOCKER_USERNAME}/ticket-service:latest
    container_name: ticket-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      SPRING_CLOUD_CONFIG_URI: ${CONFIG_SERVER_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATASOURCE_URL: ${TICKET_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${TICKET_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${TICKET_DB_PASSWORD}
    ports:
      - "8085:8085"
    restart: always
