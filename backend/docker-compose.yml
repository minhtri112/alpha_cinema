services:
  frontend:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    container_name: alpha-frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - api-gateway
    networks:
      - alpha_network

  eureka-server:
    build:
      context: .
      dockerfile: infrastructure/eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    restart: always
    networks:
      - alpha_network

  config-server:
    build:
      context: .
      dockerfile: infrastructure/config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    restart: always
    networks:
      - alpha_network

  api-gateway:
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    restart: always
    networks:
      - alpha_network
    depends_on:
      - config-server
      - eureka-server

  cinema-management-service:
    build:
      context: .
      dockerfile: core-services/cinema-management-service/Dockerfile
    container_name: cinema-management-service
    environment:
      SPRING_DATASOURCE_URL: ${CINEMA_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${CINEMA_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${CINEMA_DB_PASSWORD}
    ports:
      - "8081:8081"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network

  order-service:
    build:
      context: .
      dockerfile: core-services/order-service/Dockerfile
    container_name: order-service
    environment:
      SPRING_DATASOURCE_URL: ${ORDER_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "8082:8082"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network

  payment-service:
    build:
      context: .
      dockerfile: core-services/payment-service/Dockerfile
    container_name: payment-service
    environment:
      SPRING_DATASOURCE_URL: ${PAYMENT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "8083:8083"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network

  product-service:
    build:
      context: .
      dockerfile: core-services/product-service/Dockerfile
    container_name: product-service
    environment:
      SPRING_DATASOURCE_URL: ${PRODUCT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PRODUCT_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "8084:8084"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network

  ticket-service:
    build:
      context: .
      dockerfile: core-services/ticket-service/Dockerfile
    container_name: ticket-service
    environment:
      SPRING_DATASOURCE_URL: ${TICKET_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${TICKET_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${TICKET_DB_PASSWORD}
    ports:
      - "8085:8085"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network

  user-service:
    build:
      context: .
      dockerfile: core-services/user-service/Dockerfile
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: ${USER_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "8086:8086"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network

  notification-service:
    build:
      context: .
      dockerfile: support-services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8087:8087"
    restart: always
    networks:
      - alpha_network

  ai-service:
    build:
      context: .
      dockerfile: support-services/ai-service/Dockerfile
    container_name: ai-service
    environment:
      SPRING_DATASOURCE_URL: ${AI_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${AI_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${AI_DB_PASSWORD}
    ports:
      - "8088:8088"
    restart: always
    networks:
      - alpha_network

  redis:
    image: redis:7
    container_name: alpha-redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - alpha_redis_data:/data
    networks:
      - alpha_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: alpha-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always
    networks:
      - alpha_network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: alpha-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - alpha_kafka_data:/var/lib/kafka/data
    restart: always
    networks:
      - alpha_network

volumes:
  alpha_redis_data:
  alpha_kafka_data:

networks:
  alpha_network:
    name: alpha_network
    driver: bridge
