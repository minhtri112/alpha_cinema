services:
  ticket-service:
    build:
      context: ../..
      dockerfile: core-services/ticket-service/Dockerfile
    container_name: ticket-service
    env_file:
      - ./.env.docker
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8085:8085"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network
