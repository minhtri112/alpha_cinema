services:
  order-service:
    build:
      context: ../..
      dockerfile: core-services/order-service/Dockerfile
    container_name: order-service
    env_file:
      - ./.env.docker
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8082:8082"
    restart: always
    depends_on:
      - config-server
      - eureka-server
    networks:
      - alpha_network
