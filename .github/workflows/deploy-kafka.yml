name: Deploy Kafka

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/deploy/compose-kafka.yml"
      - "backend/deploy/kafka/Dockerfile"
      - "backend/deploy/zookeeper/Dockerfile"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Kafka image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/deploy/kafka
          file: ./backend/deploy/kafka/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kafka:latest

      - name: Build and push Zookeeper image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/deploy/zookeeper
          file: ./backend/deploy/zookeeper/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zookeeper:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.KAFKA_SSH_HOST }}
          username: ${{ secrets.COMMON_EC2_SSH_USER }}
          key: ${{ secrets.COMMON_EC2_SSH_KEY }}
          port: ${{ secrets.COMMON_EC2_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.KAFKA_DEPLOY_PATH }}
            git pull origin main
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/kafka:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/zookeeper:latest
            docker compose -f backend/deploy/compose-kafka.yml up -d
