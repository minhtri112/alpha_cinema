name: Deploy AI Service

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/support-services/ai-service/**"
      - "backend/deploy/compose-ai.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/support-services/ai-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ai-service:latest

  deploy-to-ec2:
    needs: build-and-push # Phải đợi Job 1 build xong mới chạy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_SSH_HOST }}
          username: ${{ secrets.COMMON_EC2_SSH_USER }}
          key: ${{ secrets.COMMON_EC2_SSH_KEY }}
          port: ${{ secrets.COMMON_EC2_SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.AI_DEPLOY_PATH }}
            
            # 1. Kéo file cấu hình mới nhất về (nếu có thay đổi)
            git pull origin main
            
            # 2. Đăng nhập Docker Hub trên EC2 (Nếu repo private, nếu public có thể bỏ qua)
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            # 3. Pull image đã được build ở Job 1 về
            docker pull ${{ secrets.DOCKER_USERNAME }}/ai-service:latest
            
            # 4. Pull image đã build ở Job 1
            docker pull ${{ secrets.DOCKER_USERNAME }}/ai-service:latest

            # 5. Chạy lại container (không dùng --build)
            docker compose -f backend/deploy/compose-ai.yml up -d